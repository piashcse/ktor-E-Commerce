services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ktor-ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-p123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ktor-ecommerce
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-p123}
      PORT: 8080
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:-change-me-to-at-least-32-characters-long}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-test@example.com}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-test}
    ports:
      - "8080:8080"

volumes:
  pgdata:
