name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ktor-ecommerce
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: p123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: ktor-ecommerce
      DB_USER: postgres
      DB_PASSWORD: p123
      JWT_SECRET: ci-test-secret-at-least-32-chars-long
      EMAIL_USERNAME: ci@example.com
      EMAIL_PASSWORD: ci-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew compileKotlin --no-daemon
      - run: ./gradlew test --no-daemon
      - run: ./gradlew detekt --no-daemon
      - run: ./gradlew ktlintCheck --no-daemon
