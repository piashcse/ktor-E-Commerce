name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # dependency-submission needs write access
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ktor-ecommerce
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: p123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: ktor-ecommerce
      DB_USER: postgres
      DB_PASSWORD: p123
      JWT_SECRET: ci-test-secret-at-least-32-chars-long
      EMAIL_USERNAME: ci@example.com
      EMAIL_PASSWORD: ci-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: ./gradlew compileKotlin compileTestKotlin --no-daemon

      - name: Test + coverage
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification --no-daemon

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/
          retention-days: 7

      - name: Static analysis
        run: ./gradlew detekt ktlintCheck --no-daemon

      - name: Build distribution
        run: ./gradlew installDist --no-daemon -x test

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ktor-ecom:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (SBOM + CVEs)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ktor-ecom:ci
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  dependency-submission:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/dependency-submission@v4
