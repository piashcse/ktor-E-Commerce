site_name: Ktor-E-Commerce
site_description: High-performance e-commerce backend solution built with Kotlin and Ktor.
site_url: https://piashcse.github.io/ktor-E-Commerce/
repo_url: https://github.com/piashcse/ktor-E-Commerce
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    logo: material/storefront-outline
    repo: fontawesome/brands/github
  palette:
    # Auto system preference
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to system preference

  features:
    - navigation.tabs              # Top navigation bar
    - navigation.tabs.sticky       # Keeps navigation tabs visible on scroll
    - navigation.sections          # Groups nav items into clean collapsible sections
    - navigation.expand            # Auto-expands active sections
    - navigation.path              # Breadcrumb navigation path at top of content
    - navigation.top               # 'Back to top' floating button
    - navigation.tracking          # Updates URL hash dynamically as you scroll
    - navigation.instant           # SPA-like instant page loading
    - navigation.instant.progress  # Loading progress bar for instant navigation
    - toc.follow                   # Right-hand TOC scrolls alongside reader
    - search.suggest               # Intelligent search query suggestions
    - search.highlight             # Highlights searched terms on page
    - search.share                 # Shareable deep-link search results
    - content.code.copy            # One-click code copy button
    - content.code.select          # One-click code selection button
    - content.tabs.link            # Synchronizes multi-language tabs across the entire site

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - def_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - css/extra.css

plugins:
  - search
  - meta

